name: Fireseed Return Station Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/fireseed-return-home-v0.1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test fireseed/return-home/station.test.mjs
        env:
          FIRESEED_LIVE_TEST: '1'
